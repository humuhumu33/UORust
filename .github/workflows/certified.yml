# The certified translator (loop steps 3 and 4). On every push to main that
# changes the translator, its register or the toolchain, the first job rebuilds
# the certified translator from the generated self register (`just certified`:
# the lifted translator functions exported through `lexlean production`,
# kernel-checked, replayed with verify-artifact, taken into crates/certified)
# and pushes it when it changed. The gate then runs on amd64 and on arm64, each
# twice: the ratchet against the parent commit on registers generated from both
# commits (`just ratchet`), and the differential and fixpoint (`just
# certified-gate`), whose outputs are compared by their κ, never by an exit
# code. The last job requires both architectures' κ to be equal.
name: certified

on:
  push:
    branches: [main]
    paths:
      - 'crates/uorust/**'
      - 'crates/certified/**'
      - 'frontier.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'prismpm.lock'
      - 'Justfile'
      - '.github/workflows/certified.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One run at a time, never cancelled: an export takes longer than main stays
# still, so cancelling in progress meant no export ever finished. GitHub keeps
# the newest waiting run; it runs next, on the newest main (as generate.yml).
concurrency:
  group: certified
  cancel-in-progress: false

jobs:
  # The plan: the shards that build every root the last export did not
  # refuse, each sized by the last export's seconds per root so that it fits
  # its deadline with rebuilds to spare (`certify plan`), and the roots the
  # compiler itself refused, whose whole diagnostics the diagnose job keeps.
  plan:
    name: plan the export's shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      diagnose: ${{ steps.plan.outputs.diagnose }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the last export's manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/certified-prior.sh
      - name: Plan the shards
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/sdk.sh "just certified-plan $((EXPORT_MINUTES * 60))" | tail -1 >target/plan.json
          cat target/plan.json
          echo "shards=$(jq -c .shards target/plan.json)" >>"$GITHUB_OUTPUT"
          echo "diagnose=$(jq -c .diagnose target/plan.json)" >>"$GITHUB_OUTPUT"
    env:
      EXPORT_MINUTES: 85

  # One shard of the export: every Nth root, from the Ith, built in batches
  # through `lexlean production` until EXPORT_MINUTES, then kept as an
  # artifact for the land job. A root no build reached is refused for this
  # export only.
  export:
    name: export shard ${{ matrix.shard }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      # The minutes `certify production` may build for: the job's 120 less
      # the SDK pull and the self MIR and projection before it.
      EXPORT_MINUTES: 85
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the last export's manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/certified-prior.sh
      - name: Build the shard through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/sdk.sh "just certified-project && just certified-export $SHARD $((EXPORT_MINUTES * 60))"
          echo "ARTIFACT=shard-$SHARD" >>"$GITHUB_ENV"
      - name: Keep the shard for the land job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.ARTIFACT }}
          path: target/uorust-certified
          retention-days: 7

  # Each root the compiler itself refused last time, built alone, with
  # everything lexlean prints of it in human form (the JSON diagnostic is cut
  # short) and the certificate sources it generated: the evidence an
  # upstream fix starts from. It gates nothing.
  diagnose:
    name: diagnose ${{ matrix.root }}
    needs: plan
    if: needs.plan.outputs.diagnose != '[]'
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.plan.outputs.diagnose) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ROOT: ${{ matrix.root }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the root alone through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh "just certified-project && just certified-diagnose $ROOT"
      - name: Keep its whole diagnostic and generated certificates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnose-${{ matrix.root }}
          path: |
            target/certified-diagnose/build.log
            target/certified-diagnose/request.json
            target/certified-diagnose/.lexlean/verified/*/preserve-src
          retention-days: 14

  # The land: every shard's bundles taken into crates/certified (`just
  # certified-sync`), the manifest kept for the next export, and pushed; when
  # main moved under what the sync reads, the sync is taken again on main's
  # head (land-certified.sh), each package kept only while its κ is the
  # exported one.
  land:
    name: take the shards in and land the certified translator
    needs: [plan, export]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      # The minutes after this job's start by which the last sync on a newer
      # main must have pushed: its 60 less one sync's margin.
      LAND_BY_MINUTES: 50
    steps:
      - name: Note the job's start
        shell: bash
        run: echo "STARTED=$(date +%s)" >>"$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: shard-*
          path: target/uorust-certified
      - name: Take the shards into crates/certified through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh 'just certified-sync'
      - name: Keep the manifest for the next export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: certified-manifest
          path: crates/certified/manifest.toml
          retention-days: 30
      - name: Publish the bootstrap's share
        if: always()
        shell: bash
        run: |
          {
            echo '## Certified translator'
            echo
            echo '```'
            sed -n '/^\[share\]/,/^$/p' crates/certified/manifest.toml
            # grep -c prints 0 and exits 1 when nothing matches.
            echo "certified roots: $(grep -c '^\[\[root\]\]' crates/certified/manifest.toml || true)"
            echo "refused roots: $(grep -c '^\[\[refused\]\]' crates/certified/manifest.toml || true)"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Push the certified translator and dispatch the gate and the model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REBASE: '1'
          INPUTS: 'crates/uorust/src/** crates/uorust/assets/** crates/uorust/Cargo.toml frontier.toml lift-verdicts.toml Cargo.lock rust-toolchain.toml prismpm.lock Justfile .github/workflows/certified.yml'
        run: scripts/ci/land-certified.sh "$((STARTED + LAND_BY_MINUTES * 60))"

  gate:
    name: ratchet, differential and fixpoint / ${{ matrix.runner }} / run ${{ matrix.run }}
    needs: land
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        run: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The ratchet against the parent commit
        shell: bash
        run: scripts/ci/sdk.sh 'just ratchet HEAD~1'
      - name: Fetch the core MIR core.yml dumped, by its key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          scripts/mir/fetch-mir.sh core target/core-mir
      - name: The differential and the fixpoint
        shell: bash
        run: scripts/ci/sdk.sh 'just certified-gate target/certified-gate'
      - name: Keep the outputs' κ
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: certified-kappa-${{ matrix.runner }}-${{ matrix.run }}
          path: target/certified-gate/kappa.txt
          retention-days: 7

  agree:
    name: every run on every architecture states the same κ
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: certified-kappa-*
          path: kappa
      - name: Compare the κ of the four runs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(kappa/*/kappa.txt)
          if [[ ${#files[@]} -ne 4 ]]; then
            printf 'expected four runs, found %d\n' "${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            if ! cmp -s "$f" "${files[0]}"; then
              printf '%s differs from %s\n' "$f" "${files[0]}" >&2
              diff "${files[0]}" "$f" >&2 || true
              exit 1
            fi
          done
          {
            echo '## Certified translator κ'
            echo
            echo '```'
            cat "${files[0]}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
