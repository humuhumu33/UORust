# Rendered from app/src/Engine.lex.tex by scripts/self-model/engine.py; do not edit.
# Keeps a register for each of crates.io's most-downloaded crates, so the MIR
# path grows against the code Rust developers depend on, as it does against
# core and std. The first stage reads the ranking from crates.io's own API
# (scripts/mir/top-crates.py, `sort=downloads`), each crate at its newest
# stable version, and plans the run (scripts/mir/ledger.py plan-crates): the
# held crates whose (crate@version, translator κ, toolchain κ) the attempt
# ledger has not seen first, then, on a tick, the ranking's crates it has not
# attempted, in rank order, as many as the expected seconds of them all fit
# the run's budget: 20 shards at once (Engine::crateShards), each
# a shard stage's (90 minutes) of runner time, so the run takes about
# a stage, and no more shards than GitHub's matrix holds (Engine::matrixCap). A
# crate's expected seconds are its own last measured attempt, else the mean
# of the attempts the ledger measured, as the differential check's modules
# are split by their measured cost per fuel; a shard's seconds are its
# runner time, its checkout and fetches included. A push (a new translator or
# evaluator) takes no new crate. Each crate is a shard, which runs `uorust
# crate <name>@<version> --library`: it fetches the crate, checks it against
# crates.io's checksum, dumps its library's MIR on the pinned toolchain,
# translates every body, refuses a body the register records as translated
# that is now residue, and embeds every body in LexLean beside the pinned
# rust-src's core, alloc and std, as core's and std's shards do, stamping each
# row with its embedding and the register with its `[embedding]` totals and
# blocked constructs, and checks the embedding against rustc's build of the
# crate as core's shards do (`--differential`): each of its functions over
# scalars run by the build and by the evaluator, a theorem per case that the
# two agree, the theorems split into modules by their cost and verified by
# `lexlean`, which a disagreement fails; each sampled row is stamped with its
# theorems and the register with its `[differential]` totals. It measures
# the seconds that took. The writing stage
# copies each crate's register into crates/uorust/crates/<name>, records each
# attempt with its seconds, pushes and dispatches the generate workflow. A
# crate that does not build here (one that needs a system library, say) is
# reported in the summary, recorded as attempted and made again when its κ
# moves.
name: crates

on:
  push:
    branches: [main]
    paths:
      - 'crates/uorust/src/**'
      - 'crates/uorust/assets/**'
      - 'crates/uorust/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'prismpm.lock'
      - 'scripts/mir/**'
      - '.github/workflows/crates.yml'
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: How many of crates.io's most-downloaded crates to plan from; empty for as many as the budget could hold
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: crates
  cancel-in-progress: false

env:
  # A shard's budget, in seconds: one shard stage of runner time.
  BUDGET: '5400'
  # How many shards run at once, and how many a run holds at most.
  SHARDS: '20'
  JOBS: '256'

jobs:
  list:
    name: build uorust and plan the crates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rank the crates by downloads and plan those that fit the budget
        id: crates
        shell: bash
        env:
          COUNT: ${{ inputs.count }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            echo '[]' >"$RUNNER_TEMP/ranked.json"
          else
            count=${COUNT:-$(python3 -I scripts/mir/ledger.py rank-count crates/uorust/crates "$BUDGET" "$SHARDS" "$JOBS")}
            python3 -I scripts/mir/top-crates.py crates/uorust/crates "$count" >"$RUNNER_TEMP/ranked.json"
          fi
          crates=$(python3 -I scripts/mir/ledger.py plan-crates crates/uorust/crates "$RUNNER_TEMP/ranked.json" "$EVENT" "$BUDGET" "$SHARDS" "$JOBS")
          echo "crates=$crates" >>"$GITHUB_OUTPUT"
          echo "crates: $crates" >>"$GITHUB_STEP_SUMMARY"
      - name: Build uorust through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh 'cargo build --locked -p uorust && mkdir -p target/bin && cp target/debug/uorust target/bin/'
      - name: Keep the built uorust for the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uorust-crates
          path: target/bin/uorust
          retention-days: 1
      # Core's and alloc's MIR, which each crate's program links, so a
      # crate's call into core is evaluated through core's body: dumped
      # once, as core's own workflow dumps it, for every shard.
      - name: Dump core's and alloc's MIR through the locked SDK
        if: ${{ steps.crates.outputs.crates != '[]' }}
        shell: bash
        run: scripts/ci/sdk.sh "scripts/mir/dump-lib.sh core target/library-mir/core && scripts/mir/dump-lib.sh alloc target/library-mir/alloc"
      - name: Keep core's and alloc's MIR for the shards
        if: ${{ steps.crates.outputs.crates != '[]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: library-mir-crates
          path: target/library-mir
          retention-days: 1

  shard:
    name: lift ${{ matrix.crate.name }}@${{ matrix.crate.version }}
    needs: list
    if: ${{ needs.list.outputs.crates != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        crate: ${{ fromJSON(needs.list.outputs.crates) }}
    steps:
      # The crate's seconds are the shard's runner time, from here: its
      # checkout and the rust-src it fetches count as its lift does.
      - name: Note when the shard started
        shell: bash
        run: echo "STARTED=$(date +%s)" >>"$GITHUB_ENV"
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the built uorust
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: uorust-crates
          path: target/bin
      - name: Fetch core's and alloc's MIR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: library-mir-crates
          path: target/library-mir
      # The library the crate is embedded beside: dump-lib.sh fetches the
      # pinned rust-src (hash-checked) before it lists core's modules.
      - name: Fetch the pinned rust-src through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh "scripts/mir/dump-lib.sh core --modules >/dev/null"
      - name: Fetch, dump, translate and embed the crate through the locked SDK
        shell: bash
        env:
          SPEC: ${{ matrix.crate.name }}@${{ matrix.crate.version }}
          NAME: ${{ matrix.crate.name }}
        run: |
          chmod +x target/bin/uorust
          mkdir -p target/tmp target/times
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          status=0
          scripts/ci/sdk.sh "TMPDIR=$PWD/target/tmp target/bin/uorust crate '$SPEC' --library target/rust-src-$channel/library --differential --link core=target/library-mir/core --link alloc=target/library-mir/alloc" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          # The attempt's seconds, which plan the next run, whether or not
          # the crate built.
          echo $(( $(date +%s) - STARTED )) >"target/times/$SPEC"
          mkdir -p "target/register/$NAME"
          if [ "$status" -eq 0 ]; then
            cp -r "crates/uorust/crates/$NAME/." "target/register/$NAME/"
          fi
          cp "target/times/$SPEC" target/register/
          exit "$status"
      - name: Keep the crate's register and its seconds
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crate-register-${{ matrix.crate.name }}
          path: target/register
          retention-days: 1

  merge:
    name: push the crates' registers
    needs: [list, shard]
    if: ${{ always() && needs.list.result == 'success' && needs.list.outputs.crates != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every crate's register
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: crate-register-*
          merge-multiple: true
          path: target/registers
      - name: Replace each lifted crate's register and record its attempt
        shell: bash
        env:
          CRATES: ${{ needs.list.outputs.crates }}
        run: |
          mkdir -p crates/uorust/crates target/registers
          {
            echo '## Crate registers'
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          for name in $(python3 -I -c 'import json, sys; print(" ".join(c["name"] for c in json.loads(sys.argv[1])))' "$CRATES"); do
            if [ -f "target/registers/$name/frontier.toml" ]; then
              rm -rf "crates/uorust/crates/$name"
              cp -r "target/registers/$name" "crates/uorust/crates/$name"
              python3 -I scripts/mir/ledger.py crate-line crates/uorust/crates "$name" >>"$GITHUB_STEP_SUMMARY"
            else
              echo "- $name: not lifted in this run (see its shard)" >>"$GITHUB_STEP_SUMMARY"
            fi
          done
          python3 -I scripts/mir/ledger.py record-crates crates/uorust/crates target/registers
      # Each attempt is recorded at the κ of the commit its shard checked
      # out, so a register landed over a newer translator is not taken for
      # the newer one's: the ledger holds that attempt stale, and the newer
      # commit's own run, queued behind this one, lifts the crate again.
      # It is rebased over any newer commit; one that wrote the same files
      # conflicts, and nothing is pushed.
      - name: Push the registers and regenerate the model from them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REBASE: any
        run: scripts/ci/push.sh "Regenerate the crates' registers" "crates/uorust/crates crates/uorust/ledger" generate.yml
